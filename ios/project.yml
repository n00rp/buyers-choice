name: BuyersChoice
options:
  bundleIdPrefix: se.buyerschoice
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: sv
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  BuyersChoice:
    type: application
    platform: iOS
    sources:
      - path: BuyersChoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.buyerschoice.app
        PRODUCT_NAME: BuyersChoice
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: BuyersChoice/Info.plist
      properties:
        CFBundleDisplayName: Buyers Choice
        CFBundleDevelopmentRegion: sv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Fraunces-Regular.ttf
          - Fraunces-Medium.ttf
          - Fraunces-SemiBold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: se.buyerschoice.app
            CFBundleURLSchemes: [buyerschoice]
        NSLocationWhenInUseUsageDescription: Din position används bara för att hitta adressen närmast dig. Den sparas inte och skickas inte vidare.
  BuyersChoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BuyersChoiceTests
    dependencies:
      - target: BuyersChoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.buyerschoice.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BuyersChoice.app/BuyersChoice
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  BuyersChoice:
    build:
      targets:
        BuyersChoice: all
        BuyersChoiceTests: [test]
    test:
      targets:
        - BuyersChoiceTests
      gatherCoverageData: false
